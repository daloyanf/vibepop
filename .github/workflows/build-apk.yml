name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore and Configure Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            mkdir -p app
            echo "$KEYSTORE_BASE64" | base64 --decode > app/vibepop-release.jks
            cp app/vibepop-release.jks vibepop-release.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=vibepop-release.jks\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > keystore.properties
            echo "Keystore signing configured successfully."
          else
            echo "Keystore secrets not provided or incomplete; will build without release signing configuration."
          fi

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_dist/app-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_dist/app-release.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_dist/app-release.apk
          fi
          git log -1 --pretty=format:"%B" > release_dist/RELEASE_NOTES.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: release_dist/app-release.apk
          if-no-files-found: warn

      - name: Automatically Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_dist/app-release.apk
          name: VibePop ${{ github.ref_name }} 正式发布
          body_path: release_dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
